name: Update places.json

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate places.json
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: generating places.json"

            if python generate_places.py; then
              echo "Successfully generated places.json"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Generation failed. Waiting before retry..."
              sleep $((attempt * 30))
            fi
          done

          echo "Failed to generate places.json after 3 attempts."
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add places.json

          if git diff --cached --quiet; then
            echo "No changes in places.json"
            exit 0
          fi

          git commit -m "Auto-update places.json"
          git pull --rebase
          git push
